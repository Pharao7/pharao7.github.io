<body>

<header>
    <h1>🎮 Quiz Media</h1>
    <p>Bilder & Audiodateien für mein Quiz</p>
</header>

<div class="container">

    <input
        id="search"
        class="search"
        type="text"
        placeholder="🔎 Datei suchen..."
    >

    <div id="counter" class="counter"></div>

    <div id="status" class="status">
        Dateien werden geladen...
    </div>

    <div id="content"></div>

</div>

<script>

    /* =====================================================
       GITHUB EINSTELLUNGEN
       ===================================================== */

    const GITHUB_USER = "Pharao7";
    const REPOSITORY = "pharao7.github.io";
    const BRANCH = "main";


    /* =====================================================
       AUTOMATISCHE KONFIGURATION
       ===================================================== */

    const API_URL =
        `https://api.github.com/repos/${GITHUB_USER}/${REPOSITORY}/git/trees/${BRANCH}?recursive=1`;


    /*
       WICHTIG:

       Wenn das Repository genauso heißt wie:
       Benutzername.github.io

       dann lautet die Basis-URL:

       https://benutzername.github.io/

       und NICHT:

       https://benutzername.github.io/benutzername.github.io/
    */

    const PAGE_BASE =
        REPOSITORY.toLowerCase() === `${GITHUB_USER.toLowerCase()}.github.io`
            ? `https://${GITHUB_USER.toLowerCase()}.github.io/`
            : `https://${GITHUB_USER.toLowerCase()}.github.io/${REPOSITORY}/`;


    let allFiles = [];


    /* =====================================================
       UNTERSTÜTZTE DATEITYPEN
       ===================================================== */

    const IMAGE_TYPES = [
        "jpg",
        "jpeg",
        "png",
        "gif",
        "webp",
        "svg",
        "bmp"
    ];

    const AUDIO_TYPES = [
        "mp3",
        "wav",
        "ogg",
        "m4a",
        "aac",
        "flac"
    ];


    /* =====================================================
       DATEIEN VON GITHUB LADEN
       ===================================================== */

    async function loadFiles() {

        const status = document.getElementById("status");

        try {

            const response = await fetch(API_URL);

            if (!response.ok) {
                throw new Error(
                    `GitHub API Fehler: ${response.status}`
                );
            }

            const data = await response.json();


            allFiles = data.tree

                // Nur Dateien anzeigen
                .filter(item => item.type === "blob")

                // index.html selbst nicht anzeigen
                .filter(item => item.path !== "index.html")

                .map(item => {

                    const extension =
                        item.path
                            .split(".")
                            .pop()
                            .toLowerCase();


                    let type = "other";


                    if (IMAGE_TYPES.includes(extension)) {
                        type = "image";
                    }


                    if (AUDIO_TYPES.includes(extension)) {
                        type = "audio";
                    }


                    /*
                       KORREKTE GITHUB-PAGES-URL ERSTELLEN

                       Beispiel:

                       GitHub-Datei:
                       quiz dateien/Bild.png

                       wird zu:

                       https://pharao7.github.io/quiz%20dateien/Bild.png
                    */

                    const fileUrl =
                        PAGE_BASE +
                        item.path
                            .split("/")
                            .map(part => encodeURIComponent(part))
                            .join("/");


                    return {

                        path: item.path,

                        name:
                            item.path
                                .split("/")
                                .pop(),

                        extension: extension,

                        type: type,

                        url: fileUrl

                    };

                });


            status.style.display = "none";

            renderFiles(allFiles);

        }

        catch (error) {

            status.innerHTML = `
                <div class="error">

                    <strong>
                        Dateien konnten nicht geladen werden.
                    </strong>

                    <br><br>

                    ${error.message}

                    <br><br>

                    Prüfe GitHub-Benutzername,
                    Repository und Branch.

                </div>
            `;

        }

    }


    /* =====================================================
       DATEIEN ANZEIGEN
       ===================================================== */

    function renderFiles(files) {

        const content =
            document.getElementById("content");

        const counter =
            document.getElementById("counter");


        content.innerHTML = "";


        counter.textContent =
            `${files.length} Datei(en) gefunden`;


        const images =
            files.filter(
                file => file.type === "image"
            );


        const audio =
            files.filter(
                file => file.type === "audio"
            );


        const others =
            files.filter(
                file => file.type === "other"
            );


        if (images.length > 0) {

            createSection(
                "🖼️ Bilder",
                images,
                content
            );

        }


        if (audio.length > 0) {

            createSection(
                "🎵 Audio",
                audio,
                content
            );

        }


        if (others.length > 0) {

            createSection(
                "📁 Sonstige Dateien",
                others,
                content
            );

        }


        if (files.length === 0) {

            content.innerHTML =
                "<p>Keine Dateien gefunden.</p>";

        }

    }


    /* =====================================================
       BEREICH ERSTELLEN
       ===================================================== */

    function createSection(title, files, container) {

        const heading =
            document.createElement("h2");


        heading.className =
            "section-title";


        heading.textContent =
            `${title} (${files.length})`;


        container.appendChild(heading);


        const grid =
            document.createElement("div");


        grid.className =
            "grid";


        files.forEach(file => {

            grid.appendChild(
                createCard(file)
            );

        });


        container.appendChild(grid);

    }


    /* =====================================================
       DATEI-KARTE ERSTELLEN
       ===================================================== */

    function createCard(file) {

        const card =
            document.createElement("div");


        card.className =
            "card";


        /* -----------------------------
           BILDVORSCHAU
           ----------------------------- */

        if (file.type === "image") {

            const img =
                document.createElement("img");


            img.src =
                file.url;


            img.loading =
                "lazy";


            img.alt =
                file.name;


            card.appendChild(img);

        }


        /* -----------------------------
           AUDIO PLAYER
           ----------------------------- */

        else if (file.type === "audio") {

            const audio =
                document.createElement("audio");


            audio.controls =
                true;


            audio.preload =
                "none";


            audio.src =
                file.url;


            card.appendChild(audio);

        }


        /* -----------------------------
           SONSTIGE DATEIEN
           ----------------------------- */

        else {

            const icon =
                document.createElement("div");


            icon.className =
                "other-file-icon";


            icon.textContent =
                "📄";


            card.appendChild(icon);

        }


        /* -----------------------------
           DATEINAME
           ----------------------------- */

        const filename =
            document.createElement("div");


        filename.className =
            "filename";


        filename.textContent =
            file.name;


        card.appendChild(filename);


        /* -----------------------------
           DATEIPFAD
           ----------------------------- */

        const filepath =
            document.createElement("div");


        filepath.className =
            "filepath";


        filepath.textContent =
            file.path;


        card.appendChild(filepath);


        /* -----------------------------
           URL ANZEIGEN
           ----------------------------- */

        const url =
            document.createElement("div");


        url.className =
            "url";


        url.textContent =
            file.url;


        card.appendChild(url);


        /* -----------------------------
           URL KOPIEREN BUTTON
           ----------------------------- */

        const button =
            document.createElement("button");


        button.textContent =
            "📋 URL kopieren";


        button.addEventListener(
            "click",
            async () => {

                try {

                    await navigator.clipboard.writeText(
                        file.url
                    );


                    button.textContent =
                        "✓ URL kopiert";


                    button.classList.add(
                        "copied"
                    );


                    setTimeout(() => {

                        button.textContent =
                            "📋 URL kopieren";


                        button.classList.remove(
                            "copied"
                        );

                    }, 1500);

                }

                catch {

                    /*
                       Falls Clipboard nicht funktioniert,
                       wird die URL angezeigt.
                    */

                    prompt(
                        "URL kopieren:",
                        file.url
                    );

                }

            }
        );


        card.appendChild(button);


        return card;

    }


    /* =====================================================
       SUCHFUNKTION
       ===================================================== */

    document
        .getElementById("search")
        .addEventListener(
            "input",
            event => {

                const search =
                    event.target.value
                        .toLowerCase()
                        .trim();


                const filtered =
                    allFiles.filter(file =>

                        file.path
                            .toLowerCase()
                            .includes(search)

                    );


                renderFiles(filtered);

            }
        );


    /* =====================================================
       START
       ===================================================== */

    loadFiles();

</script>

</body>
</html>
