<body>

<header>
    <h1>🎮 Quiz Media</h1>
    <p>Bilder & Audiodateien für mein Quiz</p>
</header>

<div class="container">

    <input
        id="search"
        class="search"
        type="text"
        placeholder="🔎 Datei suchen..."
    >

    <div
        id="counter"
        class="counter">
    </div>

    <div
        id="status"
        class="status">
        Dateien werden geladen...
    </div>

    <div id="content"></div>

</div>


<script>

    /* =====================================================
       GITHUB KONFIGURATION
       ===================================================== */

    const GITHUB_USER = "Pharao7";

    const REPOSITORY = "pharao7.github.io";

    const BRANCH = "main";


    /* =====================================================
       WICHTIG:
       
       Dies ist deine FESTE GitHub-Pages-Adresse.
       
       Der Repository-Name wird hier NICHT angehängt.
       
       Dadurch entsteht NICHT mehr:
       
       pharao7.github.io/pharao7.github.io/...
       
       sondern:
       
       pharao7.github.io/...
       ===================================================== */

    const PAGE_BASE =
        "https://pharao7.github.io/";


    /* =====================================================
       GITHUB API
       ===================================================== */

    const API_URL =
        "https://api.github.com/repos/" +
        GITHUB_USER +
        "/" +
        REPOSITORY +
        "/git/trees/" +
        BRANCH +
        "?recursive=1";


    let allFiles = [];


    /* =====================================================
       DATEITYPEN
       ===================================================== */

    const IMAGE_TYPES = [
        "jpg",
        "jpeg",
        "png",
        "gif",
        "webp",
        "svg",
        "bmp"
    ];


    const AUDIO_TYPES = [
        "mp3",
        "wav",
        "ogg",
        "m4a",
        "aac",
        "flac"
    ];


    /* =====================================================
       DATEI-URL ERSTELLEN
       ===================================================== */

    function createFileUrl(path) {

        /*
            Beispiel:

            path:
            quiz dateien/Bild.png

            Ergebnis:
            https://pharao7.github.io/quiz%20dateien/Bild.png
        */

        const encodedPath =
            path
                .split("/")
                .map(function(part) {
                    return encodeURIComponent(part);
                })
                .join("/");


        return PAGE_BASE + encodedPath;

    }


    /* =====================================================
       DATEIEN VON GITHUB LADEN
       ===================================================== */

    async function loadFiles() {

        const status =
            document.getElementById("status");


        try {

            const response =
                await fetch(API_URL);


            if (!response.ok) {

                throw new Error(
                    "GitHub API Fehler: " +
                    response.status
                );

            }


            const data =
                await response.json();


            if (!data.tree) {

                throw new Error(
                    "GitHub hat keine Dateiliste zurückgegeben."
                );

            }


            allFiles =
                data.tree

                    /* Nur echte Dateien */

                    .filter(function(item) {

                        return item.type === "blob";

                    })


                    /* index.html nicht anzeigen */

                    .filter(function(item) {

                        return (
                            item.path.toLowerCase()
                            !==
                            "index.html"
                        );

                    })


                    /* Dateiinformationen erstellen */

                    .map(function(item) {

                        const filename =
                            item.path
                                .split("/")
                                .pop();


                        const extension =
                            filename
                                .includes(".")
                                ?
                                filename
                                    .split(".")
                                    .pop()
                                    .toLowerCase()
                                :
                                "";


                        let type =
                            "other";


                        if (
                            IMAGE_TYPES.includes(
                                extension
                            )
                        ) {

                            type = "image";

                        }


                        if (
                            AUDIO_TYPES.includes(
                                extension
                            )
                        ) {

                            type = "audio";

                        }


                        return {

                            path:
                                item.path,

                            name:
                                filename,

                            extension:
                                extension,

                            type:
                                type,

                            /*
                                HIER wird ausschließlich
                                PAGE_BASE + Dateipfad verwendet.

                                Der Repository-Name wird
                                NICHT eingefügt.
                            */

                            url:
                                createFileUrl(
                                    item.path
                                )

                        };

                    });


            /* Alphabetisch sortieren */

            allFiles.sort(
                function(a, b) {

                    return a.path.localeCompare(
                        b.path,
                        "de",
                        {
                            numeric: true
                        }
                    );

                }
            );


            status.style.display =
                "none";


            renderFiles(
                allFiles
            );

        }

        catch (error) {

            status.innerHTML =
                '<div class="error">' +

                '<strong>' +
                'Dateien konnten nicht geladen werden.' +
                '</strong>' +

                '<br><br>' +

                error.message +

                '<br><br>' +

                'Prüfe GitHub-Benutzername, ' +
                'Repository und Branch.' +

                '</div>';

        }

    }


    /* =====================================================
       DATEIEN ANZEIGEN
       ===================================================== */

    function renderFiles(files) {

        const content =
            document.getElementById(
                "content"
            );


        const counter =
            document.getElementById(
                "counter"
            );


        content.innerHTML =
            "";


        counter.textContent =
            files.length +
            " Datei(en) gefunden";


        const images =
            files.filter(
                function(file) {

                    return (
                        file.type === "image"
                    );

                }
            );


        const audio =
            files.filter(
                function(file) {

                    return (
                        file.type === "audio"
                    );

                }
            );


        const others =
            files.filter(
                function(file) {

                    return (
                        file.type === "other"
                    );

                }
            );


        if (images.length > 0) {

            createSection(
                "🖼️ Bilder",
                images,
                content
            );

        }


        if (audio.length > 0) {

            createSection(
                "🎵 Audio",
                audio,
                content
            );

        }


        if (others.length > 0) {

            createSection(
                "📁 Sonstige Dateien",
                others,
                content
            );

        }


        if (files.length === 0) {

            content.innerHTML =
                '<div class="empty">' +
                'Keine Dateien gefunden.' +
                '</div>';

        }

    }


    /* =====================================================
       BEREICH ERSTELLEN
       ===================================================== */

    function createSection(
        title,
        files,
        container
    ) {

        const heading =
            document.createElement(
                "h2"
            );


        heading.className =
            "section-title";


        heading.textContent =
            title +
            " (" +
            files.length +
            ")";


        container.appendChild(
            heading
        );


        const grid =
            document.createElement(
                "div"
            );


        grid.className =
            "grid";


        files.forEach(
            function(file) {

                grid.appendChild(
                    createCard(file)
                );

            }
        );


        container.appendChild(
            grid
        );

    }


    /* =====================================================
       DATEI-KARTE
       ===================================================== */

    function createCard(file) {

        const card =
            document.createElement(
                "div"
            );


        card.className =
            "card";


        /* =================================================
           BILD
           ================================================= */

        if (file.type === "image") {

            const img =
                document.createElement(
                    "img"
                );


            img.src =
                file.url;


            img.alt =
                file.name;


            img.loading =
                "lazy";


            card.appendChild(
                img
            );

        }


        /* =================================================
           AUDIO
           ================================================= */

        else if (
            file.type === "audio"
        ) {

            const audio =
                document.createElement(
                    "audio"
                );


            audio.controls =
                true;


            audio.preload =
                "none";


            audio.src =
                file.url;


            card.appendChild(
                audio
            );

        }


        /* =================================================
           SONSTIGE DATEI
           ================================================= */

        else {

            const icon =
                document.createElement(
                    "div"
                );


            icon.className =
                "other-file-icon";


            icon.textContent =
                "📄";


            card.appendChild(
                icon
            );

        }


        /* =================================================
           DATEINAME
           ================================================= */

        const filename =
            document.createElement(
                "div"
            );


        filename.className =
            "filename";


        filename.textContent =
            file.name;


        card.appendChild(
            filename
        );


        /* =================================================
           DATEIPFAD
           ================================================= */

        const filepath =
            document.createElement(
                "div"
            );


        filepath.className =
            "filepath";


        filepath.textContent =
            file.path;


        card.appendChild(
            filepath
        );


        /* =================================================
           URL
           ================================================= */

        const url =
            document.createElement(
                "div"
            );


        url.className =
            "url";


        url.textContent =
            file.url;


        card.appendChild(
            url
        );


        /* =================================================
           KOPIERBUTTON
           ================================================= */

        const copyButton =
            document.createElement(
                "button"
            );


        copyButton.textContent =
            "📋 URL kopieren";


        copyButton.addEventListener(
            "click",
            async function() {

                try {

                    await navigator.clipboard
                        .writeText(
                            file.url
                        );


                    copyButton.textContent =
                        "✓ URL kopiert";


                    copyButton.classList.add(
                        "copied"
                    );


                    setTimeout(
                        function() {

                            copyButton.textContent =
                                "📋 URL kopieren";


                            copyButton.classList.remove(
                                "copied"
                            );

                        },
                        1500
                    );

                }

                catch (error) {

                    prompt(
                        "URL kopieren:",
                        file.url
                    );

                }

            }
        );


        card.appendChild(
            copyButton
        );


        /* =================================================
           DATEI DIREKT ÖFFNEN
           ================================================= */

        const openButton =
            document.createElement(
                "a"
            );


        openButton.className =
            "open-button";


        openButton.href =
            file.url;


        openButton.target =
            "_blank";


        openButton.rel =
            "noopener noreferrer";


        openButton.textContent =
            "↗ Datei öffnen";


        card.appendChild(
            openButton
        );


        return card;

    }


    /* =====================================================
       SUCHE
       ===================================================== */

    document
        .getElementById(
            "search"
        )
        .addEventListener(
            "input",
            function(event) {

                const search =
                    event.target.value
                        .toLowerCase()
                        .trim();


                const filtered =
                    allFiles.filter(
                        function(file) {

                            return file.path
                                .toLowerCase()
                                .includes(
                                    search
                                );

                        }
                    );


                renderFiles(
                    filtered
                );

            }
        );


    /* =====================================================
       START
       ===================================================== */

    loadFiles();

</script>

</body>
</html>
